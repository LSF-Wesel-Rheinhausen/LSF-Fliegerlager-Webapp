name: ${COMPOSE_PROJECT_NAME:-fliegerlager}

services:
  storage-migrate:
    image: ${APP_IMAGE:-ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:latest}
    user: "0:0"
    restart: "no"
    entrypoint: ["python", "-m", "config.persistence_migration"]
    command: []
    environment:
      PERSISTENCE_ROOT: /data
      POSTGRES_MAJOR: "16"
    volumes:
      - ${PERSISTENCE_DIR:-./data}:/data
      - postgres_data:/legacy/postgres:ro
      - media_data:/legacy/media:ro
      - updater_state:/legacy/updater-state:ro
      - ${BACKUP_DIR:-./backups}:/legacy/backups:ro

  app:
    image: ${APP_IMAGE:-ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:latest}
    restart: unless-stopped
    environment:
      AUTHELIA_SSO_EMAIL_HEADER: ${AUTHELIA_SSO_EMAIL_HEADER:-Remote-Email}
      AUTHELIA_SSO_ENABLED: ${AUTHELIA_SSO_ENABLED:-0}
      BACKUP_DIR: /backups
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-0}
      DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-0}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      DJANGO_TRUST_PROXY_SSL_HEADER: ${DJANGO_TRUST_PROXY_SSL_HEADER:-0}
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:-}
      KIOSK_ACCESS_TRUSTED_PROXY_ADDRESSES: ${KIOSK_ACCESS_TRUSTED_PROXY_ADDRESSES:-}
      PASSKEY_ENABLED: ${PASSKEY_ENABLED:-0}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-Fliegerlager-Abrechnung}
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:?UPDATE_AGENT_TOKEN must be set in .env}
      UPDATE_AGENT_URL: ${UPDATE_AGENT_URL:-http://updater:8080}
      WEB_PUSH_ALLOWED_ORIGINS: ${WEB_PUSH_ALLOWED_ORIGINS:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-0}
      WEB_PUSH_KEY_DIR: /run/secrets/webpush
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.invalid}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      storage-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    labels:
      io.lsf-fliegerlager.update-target: "true"
    volumes:
      - ${PERSISTENCE_DIR:-./data}/media:/app/src/media
      - ${PERSISTENCE_DIR:-./data}/backups:/backups
      - ${PERSISTENCE_DIR:-./data}/secrets/webpush:/run/secrets/webpush
    networks:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fliegerlager}
      POSTGRES_USER: ${POSTGRES_USER:-fliegerlager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    depends_on:
      storage-migrate:
        condition: service_completed_successfully
    volumes:
      - ${PERSISTENCE_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ${PERSISTENCE_DIR:-./data}/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  updater:
    image: ${UPDATER_IMAGE:-ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp-updater:latest}
    restart: unless-stopped
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:?UPDATE_AGENT_TOKEN must be set in .env}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      PORTAINER_URL: ${PORTAINER_URL:?PORTAINER_URL must be set in .env}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:?PORTAINER_API_KEY must be set in .env}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:?PORTAINER_ENDPOINT_ID must be set in .env}
      PORTAINER_STACK_ID: ${PORTAINER_STACK_ID:?PORTAINER_STACK_ID must be set in .env}
      APP_HEALTH_URL: ${APP_HEALTH_URL:-http://app:8000/healthz/}
      TARGET_SERVICE: ${TARGET_SERVICE:-app}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      UPDATE_REGISTRY_ALLOWED_HOSTS: ${UPDATE_REGISTRY_ALLOWED_HOSTS:-ghcr.io}
      UPDATE_HEALTH_TIMEOUT: ${UPDATE_HEALTH_TIMEOUT:-180}
      MAX_AGENT_BODY_BYTES: ${MAX_AGENT_BODY_BYTES:-1048576}
      AGENT_READ_TIMEOUT_SECONDS: ${AGENT_READ_TIMEOUT_SECONDS:-10}
      MAX_AGENT_CONCURRENT_REQUESTS: ${MAX_AGENT_CONCURRENT_REQUESTS:-8}
      BACKUP_DIR: /backups
      TZ: ${TZ:-Europe/Berlin}
      PORTAINER_VERIFY_SSL: ${PORTAINER_VERIFY_SSL:-true}
    depends_on:
      storage-migrate:
        condition: service_completed_successfully
    volumes:
      - ${PERSISTENCE_DIR:-./data}/backups:/backups
      - ${PERSISTENCE_DIR:-./data}/updater-state:/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; request=urllib.request.Request('http://127.0.0.1:8080/healthz', headers={'Authorization': 'Bearer ' + os.environ['UPDATE_AGENT_TOKEN']}); urllib.request.urlopen(request, timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

  daily-settlement-backup:
    image: ${APP_IMAGE:-ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:latest}
    restart: unless-stopped
    environment:
      BACKUP_DIR: /backups
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DAILY_SETTLEMENT_BACKUP_INTERVAL_SECONDS: ${DAILY_SETTLEMENT_BACKUP_INTERVAL_SECONDS:-300}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
    command: ["python", "manage.py", "run_daily_settlement_backup", "--loop"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
      updater:
        condition: service_healthy
    volumes:
      - ${PERSISTENCE_DIR:-./data}/media:/app/src/media
      - ${PERSISTENCE_DIR:-./data}/backups:/backups
    networks:
      - backend

  push-worker:
    image: ${APP_IMAGE:-ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      WEB_PUSH_ALLOWED_ORIGINS: ${WEB_PUSH_ALLOWED_ORIGINS:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-0}
      WEB_PUSH_KEY_DIR: /run/secrets/webpush
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.invalid}
      WEB_PUSH_WORKER_INTERVAL_SECONDS: ${WEB_PUSH_WORKER_INTERVAL_SECONDS:-60}
    command: ["python", "manage.py", "run_push_worker", "--loop"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ${PERSISTENCE_DIR:-./data}/secrets/webpush:/run/secrets/webpush:ro
    networks:
      - frontend
      - backend

  email-worker:
    image: ${APP_IMAGE:-ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
    command: ["python", "manage.py", "run_email_worker", "--loop"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend

volumes:
  media_data:
  postgres_data:
  updater_state:

networks:
  frontend:
  backend:
    internal: true
