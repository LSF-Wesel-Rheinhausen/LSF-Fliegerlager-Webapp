{% for invite in pending_invites %}
  <div class="kiosk-list-row">
    <div class="kiosk-list-row__content">
      <strong>{{ invite.inviter.full_name }}</strong>
      <span>möchte eine gegenseitige Partner-Vollmacht für dieses Lager einrichten.</span>
    </div>
    <form method="post" action="{{ kiosk_urls.partner_activity }}" class="inline-actions kiosk-list-row__actions">
      {% csrf_token %}
      <input type="hidden" name="booking_link_id" value="{{ invite.pk }}">
      <button type="submit" name="action" value="booking_link_accept">Annehmen</button>
      <button type="submit" name="action" value="booking_link_decline" class="button-secondary">Ablehnen</button>
    </form>
  </div>
{% endfor %}
