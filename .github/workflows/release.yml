name: Promote production images

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-image-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/lsf-wesel-rheinhausen
  APP: lsf-fliegerlager-webapp
  UPDATER: lsf-fliegerlager-webapp-updater

jobs:
  promote-prod:
    name: Promote tested staging digests
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout protected main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote production image pair
        run: |
          set -euo pipefail
          inspect_digest() {
            local reference="$1" digest inspect_error inspect_status
            inspect_error="$(mktemp)"
            if digest="$(docker buildx imagetools inspect "$reference" --format '{{.Manifest.Digest}}' 2>"$inspect_error")"; then
              rm -f "$inspect_error"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              printf '%s' "$digest"
              return 0
            else
              inspect_status=$?
            fi
            if grep -Fq '404 Not Found' "$inspect_error"; then
              rm -f "$inspect_error"
              return 44
            fi
            cat "$inspect_error" >&2
            rm -f "$inspect_error"
            return "$inspect_status"
          }
          ensure_immutable_tag() {
            local repository="$1" tag="$2" expected="$3" existing status
            if existing="$(inspect_digest "$repository:$tag")"; then
              test "$existing" = "$expected"
            else
              status=$?
              test "$status" -eq 44 || return "$status"
              [[ "${VALIDATE_ONLY:-0}" = 1 ]] && return 0
              docker buildx imagetools create --tag "$repository:$tag" "$repository@$expected"
              test "$(inspect_digest "$repository:$tag")" = "$expected"
            fi
          }
          APP_SOURCE="$REGISTRY/$APP:latest"
          UPDATER_SOURCE="$REGISTRY/$UPDATER:latest"
          APP_DIGEST="$(inspect_digest "$APP_SOURCE")"
          UPDATER_DIGEST="$(inspect_digest "$UPDATER_SOURCE")"
          docker pull --platform linux/amd64 "$REGISTRY/$APP@$APP_DIGEST"
          docker pull --platform linux/amd64 "$REGISTRY/$UPDATER@$UPDATER_DIGEST"
          APP_REVISION="$(docker image inspect "$REGISTRY/$APP@$APP_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          UPDATER_REVISION="$(docker image inspect "$REGISTRY/$UPDATER@$UPDATER_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          MAIN_REVISION="$(git rev-parse HEAD)"
          test "$APP_REVISION" = "$UPDATER_REVISION"
          test "$APP_REVISION" = "$MAIN_REVISION"
          [[ "$APP_REVISION" =~ ^[0-9a-f]{40}$ ]]
          # Both immutable references must be valid before changing either prod pointer.
          for VALIDATE_ONLY in 1 0; do
            ensure_immutable_tag "$REGISTRY/$APP" "prod-$APP_REVISION" "$APP_DIGEST"
            ensure_immutable_tag "$REGISTRY/$UPDATER" "prod-$UPDATER_REVISION" "$UPDATER_DIGEST"
          done
          previous_digest() {
            local reference="$1" digest status
            if digest="$(inspect_digest "$reference")"; then
              printf '%s' "$digest"
            else
              status=$?
              test "$status" -eq 44 || return "$status"
              return 0
            fi
          }
          PREVIOUS_APP_PROD_DIGEST="$(previous_digest "$REGISTRY/$APP:prod")"
          PREVIOUS_UPDATER_PROD_DIGEST="$(previous_digest "$REGISTRY/$UPDATER:prod")"
          if [[ -z "$PREVIOUS_APP_PROD_DIGEST" && -z "$PREVIOUS_UPDATER_PROD_DIGEST" ]]; then
            # On the first release repair forward to the verified pair instead
            # of deleting registry manifests also referenced by staging tags.
            PREVIOUS_APP_PROD_DIGEST="$APP_DIGEST"
            PREVIOUS_UPDATER_PROD_DIGEST="$UPDATER_DIGEST"
          elif [[ -z "$PREVIOUS_APP_PROD_DIGEST" || -z "$PREVIOUS_UPDATER_PROD_DIGEST" ]]; then
            echo 'Incomplete existing production pair; repair it before promotion.' >&2
            exit 1
          fi
          restore_previous_prod_pair() {
            local failed=0
            docker buildx imagetools create --tag "$REGISTRY/$APP:prod" "$REGISTRY/$APP@$PREVIOUS_APP_PROD_DIGEST" || failed=1
            docker buildx imagetools create --tag "$REGISTRY/$UPDATER:prod" "$REGISTRY/$UPDATER@$PREVIOUS_UPDATER_PROD_DIGEST" || failed=1
            test "$(inspect_digest "$REGISTRY/$APP:prod")" = "$PREVIOUS_APP_PROD_DIGEST" || failed=1
            test "$(inspect_digest "$REGISTRY/$UPDATER:prod")" = "$PREVIOUS_UPDATER_PROD_DIGEST" || failed=1
            return "$failed"
          }
          recover_failed_promotion() {
            local status=$?
            trap - EXIT INT TERM
            if ! restore_previous_prod_pair; then
              echo 'Production pair recovery failed; restore the recorded digest pair manually.' >&2
              printf 'app=%s updater=%s\n' "$PREVIOUS_APP_PROD_DIGEST" "$PREVIOUS_UPDATER_PROD_DIGEST" >&2
            fi
            exit "$status"
          }
          trap recover_failed_promotion EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker buildx imagetools create --tag "$REGISTRY/$APP:prod" "$REGISTRY/$APP@$APP_DIGEST"
          docker buildx imagetools create --tag "$REGISTRY/$UPDATER:prod" "$REGISTRY/$UPDATER@$UPDATER_DIGEST"
          FINAL_APP_PROD_DIGEST="$(inspect_digest "$REGISTRY/$APP:prod")"
          FINAL_UPDATER_PROD_DIGEST="$(inspect_digest "$REGISTRY/$UPDATER:prod")"
          test "$FINAL_APP_PROD_DIGEST" = "$APP_DIGEST"
          test "$FINAL_UPDATER_PROD_DIGEST" = "$UPDATER_DIGEST"
          trap - EXIT INT TERM
