name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.relevance.outputs.run_ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant pull request changes
        id: relevance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "run_ci=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          printf '%s\n' "${changed_files}"
          if printf '%s\n' "${changed_files}" | grep -Eqv '^(graphify-out/|docs/)|\.md$'; then
            echo "run_ci=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_ci=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Django check
        run: python src/manage.py check

      - name: Mypy
        run: python -m mypy src

  python_tests:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: >-
        mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Playwright version
        env:
          EXPECTED_PLAYWRIGHT_VERSION: "1.61.1"
        run: >-
          node -e "const version=require('playwright/package.json').version;
          if(version!==process.env.EXPECTED_PLAYWRIGHT_VERSION){
          console.error('Expected Playwright '+process.env.EXPECTED_PLAYWRIGHT_VERSION+', got '+version);
          process.exit(1);}"

      - name: Browser UI tests
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
        run: npm run test:e2e -- --project="${PLAYWRIGHT_PROJECT}"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            /tmp/django-e2e-3101.log
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI / Gate
    if: ${{ always() && !cancelled() }}
    needs:
      - changes
      - quality
      - python_tests
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python_tests.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "${CHANGES_RESULT}" = "success"
          if [ "${RUN_CI}" = "false" ]; then
            test "${QUALITY_RESULT}" = "skipped"
            test "${PYTHON_TESTS_RESULT}" = "skipped"
            test "${E2E_RESULT}" = "skipped"
          else
            test "${QUALITY_RESULT}" = "success"
            test "${PYTHON_TESTS_RESULT}" = "success"
            test "${E2E_RESULT}" = "success"
          fi
