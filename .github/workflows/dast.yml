name: DAST ZAP Scan

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'graphify-out/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'graphify-out/**'
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '0 5 * * 1'

jobs:
  zap_scan_pr:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline Scan
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and Start Application
        run: |
          # Build test image
          docker build -t lsf-webapp:test .
          # Run the production entrypoint so ZAP scans Gunicorn and WhiteNoise, not Django's dev static handler.
          docker run -d \
            -p 8000:8000 \
            --name lsf-webapp \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_SECRET_KEY=test-only-zap-secret-with-more-than-fifty-characters-1234567890 \
            lsf-webapp:test
          # Wait for the server to be ready
          sleep 10

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-scan'
          allow_issue_writing: false
          cmd_options: '-a'

  zap_scan_trusted:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline Scan (trusted)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and Start Application
        run: |
          docker build -t lsf-webapp:test .
          docker run -d \
            -p 8000:8000 \
            --name lsf-webapp \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_SECRET_KEY=test-only-zap-secret-with-more-than-fifty-characters-1234567890 \
            lsf-webapp:test
          sleep 10

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-scan'
          allow_issue_writing: true
          cmd_options: '-a'
