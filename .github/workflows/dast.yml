name: DAST ZAP Scan

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'graphify-out/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'graphify-out/**'
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zap_scan_pr:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline Scan
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and Start Application
        run: |
          docker build -t lsf-webapp:test .

      - name: Start DAST application
        run: scripts/dast-lifecycle.sh start

      - name: Wait for DAST application health
        run: scripts/dast-lifecycle.sh wait

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-scan'
          allow_issue_writing: false
          cmd_options: '-a'

      - name: Clean up DAST application
        if: ${{ always() }}
        run: scripts/dast-lifecycle.sh cleanup

  zap_scan_trusted:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline Scan (trusted)
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and Start Application
        run: |
          docker build -t lsf-webapp:test .

      - name: Start DAST application
        run: scripts/dast-lifecycle.sh start

      - name: Wait for DAST application health
        run: scripts/dast-lifecycle.sh wait

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-scan'
          allow_issue_writing: true
          cmd_options: '-a'

      - name: Clean up DAST application
        if: ${{ always() }}
        run: scripts/dast-lifecycle.sh cleanup
