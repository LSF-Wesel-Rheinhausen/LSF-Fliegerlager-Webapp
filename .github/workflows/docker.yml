name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "Dockerfile.updater"
      - "deploy/**"
      - "deployment_agent.py"
      - "requirements*.txt"
      - "scripts/build_changelog_manifest.py"
      - "src/**"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate containers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read build metadata
        id: metadata
        run: |
          echo "version=$(git rev-list --first-parent --count HEAD)" >> "${GITHUB_OUTPUT}"
          echo "change=$(git log -1 --pretty=%s)" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          {
            echo "changelog<<EOF"
            python scripts/build_changelog_manifest.py
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build application image for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: lsf-webapp:test
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app,ignore-error=true
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            APP_REVISION=${{ github.event.pull_request.head.sha }}
            APP_BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_CHANGE=${{ steps.metadata.outputs.change }}
            APP_CHANGELOG=${{ steps.metadata.outputs.changelog }}

      - name: Build updater image for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.updater
          load: true
          platforms: linux/amd64
          tags: lsf-webapp-updater:test
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater,ignore-error=true

      - name: Test application image
        run: >-
          docker run --rm
          -e DJANGO_DEBUG=1
          lsf-webapp:test python manage.py check

      - name: Test updater image
        run: >-
          docker run --rm --entrypoint python
          lsf-webapp-updater:test -m py_compile deployment_agent.py

      - name: Validate deployment example
        run: |
          cp deploy/.env.example deploy/.env
          cp deploy/docker-compose.example.yml deploy/docker-compose.yml
          docker compose --project-directory deploy config --quiet

  publish:
    name: Publish containers
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check whether tested commit is current main
        id: eligibility
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main_sha="$(git rev-parse origin/main)"
          if [ "${current_main_sha}" = "${TARGET_SHA}" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping superseded commit ${TARGET_SHA}; current main is ${current_main_sha}."
          fi

      - name: Set up Docker Buildx
        if: steps.eligibility.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Read build metadata
        if: steps.eligibility.outputs.publish == 'true'
        id: metadata
        run: |
          echo "version=$(git rev-list --first-parent --count HEAD)" >> "${GITHUB_OUTPUT}"
          echo "change=$(git log -1 --pretty=%s)" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          {
            echo "changelog<<EOF"
            python scripts/build_changelog_manifest.py
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build application image for tests
        if: steps.eligibility.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: lsf-webapp:test
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app,ignore-error=true
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            APP_REVISION=${{ env.TARGET_SHA }}
            APP_BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_CHANGE=${{ steps.metadata.outputs.change }}
            APP_CHANGELOG=${{ steps.metadata.outputs.changelog }}

      - name: Build updater image for tests
        if: steps.eligibility.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.updater
          load: true
          platforms: linux/amd64
          tags: lsf-webapp-updater:test
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater,ignore-error=true

      - name: Test application image
        if: steps.eligibility.outputs.publish == 'true'
        run: >-
          docker run --rm
          -e DJANGO_DEBUG=1
          lsf-webapp:test python manage.py check

      - name: Test updater image
        if: steps.eligibility.outputs.publish == 'true'
        run: >-
          docker run --rm --entrypoint python
          lsf-webapp-updater:test -m py_compile deployment_agent.py

      - name: Validate deployment example
        if: steps.eligibility.outputs.publish == 'true'
        run: |
          cp deploy/.env.example deploy/.env
          cp deploy/docker-compose.example.yml deploy/docker-compose.yml
          docker compose --project-directory deploy config --quiet

      - name: Recheck current main commit
        if: steps.eligibility.outputs.publish == 'true'
        id: final_eligibility
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main_sha="$(git rev-parse origin/main)"
          if [ "${current_main_sha}" = "${TARGET_SHA}" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Main advanced to ${current_main_sha}; images for ${TARGET_SHA} will not be published."
          fi

      - name: Log in to the container registry
        if: steps.final_eligibility.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish application image
        if: steps.final_eligibility.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:latest
            ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app,ignore-error=true
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            APP_REVISION=${{ env.TARGET_SHA }}
            APP_BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_CHANGE=${{ steps.metadata.outputs.change }}
            APP_CHANGELOG=${{ steps.metadata.outputs.changelog }}

      - name: Publish updater image
        if: steps.final_eligibility.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.updater
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp-updater:latest
            ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp-updater:${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater,ignore-error=true
