name: Docker

on:
  pull_request: {}
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: read

jobs:
  docker-test:
    name: Build and test containers
    if: >-
      ${{ github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: docker-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Read build metadata
        id: metadata
        run: |
          echo "version=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "change=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            python scripts/build_changelog_manifest.py --max-bytes 60000
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build application image for tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: lsf-webapp:test
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            APP_REVISION=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            APP_BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_CHANGE=${{ steps.metadata.outputs.change }}
            APP_CHANGELOG=${{ steps.metadata.outputs.changelog }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build updater image for tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.updater
          load: true
          tags: lsf-webapp-updater:test
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Test application image
        run: >-
          docker run --rm
          -e DJANGO_DEBUG=1
          lsf-webapp:test python manage.py check

      - name: Test updater image
        run: docker run --rm --entrypoint python lsf-webapp-updater:test -m py_compile deployment_agent.py

      - name: Validate deployment example
        run: |
          cp deploy/.env.example deploy/.env
          cp deploy/docker-compose.example.yml deploy/docker-compose.yml
          docker compose --project-directory deploy config --quiet

  docker-publish:
    name: Publish containers
    needs: docker-test
    if: >-
      ${{ needs.docker-test.result == 'success' &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify main has not moved
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$actual_sha" = "$TESTED_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Read build metadata
        id: metadata
        run: |
          echo "version=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "change=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            python scripts/build_changelog_manifest.py --max-bytes 60000
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:${{ github.event.workflow_run.head_sha }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            APP_REVISION=${{ github.event.workflow_run.head_sha }}
            APP_BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_CHANGE=${{ steps.metadata.outputs.change }}
            APP_CHANGELOG=${{ steps.metadata.outputs.changelog }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Publish updater image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.updater
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp-updater:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Verify main has not moved before latest promotion
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$actual_sha" = "$TESTED_SHA"

      - name: Promote application image
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:latest
          ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp:${TESTED_SHA}

      - name: Promote updater image
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp-updater:latest
          ghcr.io/lsf-wesel-rheinhausen/lsf-fliegerlager-webapp-updater:${TESTED_SHA}
